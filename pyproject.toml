[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaverse"
version = "0.3.0"
description = "World Labs Marble world generation and pharmaceutical simulation research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pharmaverse-worlds = "pharmaverse.worlds.cli:main"
pharmaverse-usd = "pharmaverse.usd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
